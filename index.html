<!DOCTYPE html>
<html lang="ta">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interior Gurukulam | இன்டீரியர் குருகுலம்</title>
  <meta name="description"
    content="Interior Gurukulam — கற்றதும் கற்பித்ததும் கற்போம் உருவாக்குவோம். Courses, franchise, skilled workers & free training.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Noto+Sans+Tamil:wght@400;500;600;700&family=Noto+Serif+Tamil:wght@500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="page">

    <!-- Top nav -->
    <header class="nav">
      <a href="index.html" class="nav__link">HOME</a>
      <a href="index.html" class="nav__lotus" aria-label="Interior Gurukulam Home">
        <img class="lotus" src="icons/lotus.svg" alt="">
      </a>
      <a href="contact.html" class="nav__link">CONTACT</a>
    </header>

    <!-- Hero -->
    <main class="hero" id="home">
      <a href="index.html" class="hero__logo" aria-label="Interior Gurukulam Home">
        <img src="assets/logo.png" alt="Interior Gurukulam logo" class="logo">
      </a>

      <h1 class="hero__title">
        <span class="hero__title-ta">
          <span class="word"><span class="c-terracotta">இன்</span><span class="c-gold">டீ</span><span
              class="c-terracotta">ரியர்</span></span>
          <span class="word c-olive">குருகுலம்</span>
        </span>
        <span class="hero__title-en">INTERIOR GURUKULAM</span>
      </h1>

      <p class="hero__tagline">
        கற்றதும் <span class="dot">•</span>
        கற்பித்ததும் <span class="dot">•</span>
        கற்போம் <span class="dot">•</span>
        உருவாக்குவோம்
      </p>

      <div class="divider" aria-hidden="true">
        <span class="divider__line"></span>
        <img class="divider__lotus lotus" src="icons/lotus-terracotta.svg" alt="">
        <span class="divider__line"></span>
      </div>
    </main>

    <!-- Service cards -->
    <section class="cards" aria-label="Services">

      <a href="courses-new.html" class="card card--olive">
        <span class="card__icon" aria-hidden="true">
          <img src="icons/icon-all-courses.png" alt="">
        </span>
        <span class="card__body">
          <span class="card__title">ALL<br>COURSES</span>
          <span class="card__rule" aria-hidden="true">
            <i></i>
            <img class="lotus" src="icons/lotus.svg" alt="">
            <i></i>
          </span>
        </span>
        <span class="card__go" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="2.4"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M13 6l6 6-6 6" />
          </svg>
        </span>
      </a>

      <a href="nri-training.html" class="card card--terracotta">
        <span class="card__icon" aria-hidden="true">
          <img src="icons/icon-nri-training.png" alt="">

        <span class="card__body">
          <span class="card__title">NRI ONLINE<br>TRAINING</span>
          <span class="card__rule" aria-hidden="true">
            <i></i>
            <img class="lotus" src="icons/lotus.svg" alt="">
            <i></i>
          </span>
        </span>
        <span class="card__go" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="2.4"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M13 6l6 6-6 6" />
          </svg>
        </span>
      </a>

      <a href="franchise-new.html" class="card card--olive">
        <span class="card__icon" aria-hidden="true">
          <img src="icons/icon-business-franchise.png" alt="">
        </span>
        <span class="card__body">
          <span class="card__title">BUSINESS<br>FRANCHISE</span>
          <span class="card__rule" aria-hidden="true">
            <i></i>
            <img class="lotus" src="icons/lotus.svg" alt="">
            <i></i>
          </span>
        </span>
        <span class="card__go" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="2.4"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M13 6l6 6-6 6" />
          </svg>
        </span>
      </a>

      <a href="joint-venture.html" class="card card--gold">
        <span class="card__icon" aria-hidden="true">
          <img src="icons/icon-joint-venture.png" alt="">

        <span class="card__body">
          <span class="card__title">FOR INTERIOR<br class="br-desk">OWNER<br>JOINT VENTURE</span>
          <span class="card__rule" aria-hidden="true">
            <i></i>
            <img class="lotus" src="icons/lotus.svg" alt="">
            <i></i>
          </span>
        </span>
        <span class="card__go" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="2.4"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M13 6l6 6-6 6" />
          </svg>
        </span>
      </a>

        <path d="M0,70 C240,20 480,100 720,55 C960,10 1200,90 1440,45 L1440,120 L0,120 Z" fill="currentColor" />
      </svg>
      <svg class="footer__wave footer__wave--olive" viewBox="0 0 1440 140" preserveAspectRatio="none"

      </svg>
      <div class="footer__lotus" aria-hidden="true">
        <span class="footer__line"></span>
        <img class="lotus" src="icons/lotus.svg" alt="">
